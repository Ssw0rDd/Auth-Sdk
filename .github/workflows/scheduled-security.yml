name: scheduled-security

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm audit --audit-level=high
      - run: npm ci --ignore-scripts
      - run: npm run pentest
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly fuzz run untrusted_validation -- -max_total_time=60
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: error
