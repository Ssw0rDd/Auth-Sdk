[package]
name = "sdk-auth-oauth-node"
description = "Portable N-API binding for SDK-Auth OAuth and OIDC providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi.workspace = true
napi-derive.workspace = true
sdk-auth-core = { path = "../sdk-auth-core", version = "=0.6.0" }
sdk-auth-error = { path = "../sdk-auth-error", version = "=0.6.0" }
sdk-auth-oauth = { path = "../sdk-auth-oauth", version = "=0.6.0" }
sdk-auth-types = { path = "../sdk-auth-types", version = "=0.6.0" }

[build-dependencies]
napi-build.workspace = true

[lints.rust]
missing_docs = "deny"
unused_must_use = "deny"

[lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
