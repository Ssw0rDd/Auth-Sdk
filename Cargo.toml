[workspace]
members = [
    "crates/sdk-auth-authorization",
    "crates/sdk-auth-core",
    "crates/sdk-auth-crypto",
    "crates/sdk-auth-error",
    "crates/sdk-auth-memory",
    "crates/sdk-auth-mfa",
    "crates/sdk-auth-node",
    "crates/sdk-auth-postgres",
    "crates/sdk-auth-redis",
    "crates/sdk-auth-sqlite",
    "crates/sdk-auth-migrate",
    "crates/sdk-auth-testing",
    "crates/sdk-auth-types",
    "crates/sdk-auth-validation",
    "crates/sdk-auth-wasm",
    "crates/sdk-auth-webauthn",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["SDK-Auth maintainers"]
publish = false

[workspace.dependencies]
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
async-trait = "0.1.89"
base64 = "0.22.1"
blake3 = "1.8.2"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
criterion = { version = "0.7.0", features = ["html_reports"] }
email_address = "0.2.9"
hmac = { version = "0.13.0", features = ["zeroize"] }
insta = { version = "1.43.2", features = ["json"] }
napi = { version = "3.4.0", default-features = false, features = ["napi8", "tokio_rt"] }
napi-build = "2.2.3"
napi-derive = "3.3.0"
proptest = "1.8.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1.12.2"
redis = { version = "=1.4.1", default-features = false, features = ["acl", "connection-manager", "script", "tokio-rustls-comp"] }
rusqlite = { version = "0.37.0", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = { version = "0.11.0", features = ["zeroize"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "json", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
url = "2.5.7"
ulid = { version = "1.2.1", default-features = false }
uuid = { version = "1.18.1", features = ["js", "serde", "v7"] }
wasm-bindgen = "0.2.105"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package.argon2]
opt-level = 2
