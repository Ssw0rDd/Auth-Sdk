<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" role="img" aria-label="SDK-Auth">
  <title>SDK-Auth</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="55%" stop-color="#0b0b0c"/>
      <stop offset="100%" stop-color="#1a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#c41010"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="200" rx="16" fill="url(#bg)"/>
  <rect width="960" height="200" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="200" rx="2" fill="url(#accent)"/>

  <!-- mark -->
  <g transform="translate(40 48)">
    <rect x="0" y="0" width="84" height="104" rx="14" fill="#17171a" stroke="#ff2d2d" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M22 28h40v10H38v38H22V28zm0 52h40v10H22V80z" fill="#ff2d2d"/>
    <circle cx="62" cy="78" r="8" fill="none" stroke="#e8e6e3" stroke-width="3"/>
    <path d="M67 83l8 8" stroke="#e8e6e3" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="150" y="88" fill="#f5f3f0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5">SDK-Auth</text>
  <text x="150" y="124" fill="#ff5c5c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Modular auth core in Rust</text>
  <text x="150" y="152" fill="#b8b4ae" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Token-blind BFF  |  browser  |  UI  |  WebAuthn  |  OAuth  |  MFA  |  RBAC</text>
</svg>
