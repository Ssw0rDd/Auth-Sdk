<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050608" />
    <title>SDK-Auth UI</title>
    <script type="module" src="/src/demo.ts"></script>
    <style>
      html { background: #050608; }
      body {
        min-width: 20rem;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(125deg, rgb(244 63 78 / 7%), transparent 35%),
          #050608;
      }
      sdk-auth-login { width: min(92rem, calc(100vw - 2rem)); }
      sdk-auth-challenge { width: min(34rem, calc(100vw - 2rem)); }
    </style>
  </head>
  <body>
    <sdk-auth-login show-passkey>
      <a slot="forgot-password" href="#recover">Esqueci a senha</a>
      <span slot="register">Novo por aqui? <a href="#register">Crie sua identidade</a></span>
    </sdk-auth-login>
    <sdk-auth-challenge hidden>
      <a slot="cancel" href="#login">Voltar ao login</a>
    </sdk-auth-challenge>
  </body>
</html>
