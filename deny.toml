[advisories]
# RISK-001: transitive through openidconnect for public-key JWT verification only.
# The vulnerable RSA private-key operations are not reachable from sdk-auth-oauth.
# Remove as soon as RustCrypto publishes a patched release; review by 2026-11-08.
ignore = ["RUSTSEC-2023-0071"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Mozilla root certificate data distributed by webpki-roots.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
